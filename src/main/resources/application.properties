server.port=8080

# SQLite
spring.datasource.url=jdbc:sqlite:./data/university.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls,.gqls

# Springdoc
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.url=/api/v1/openapi
springdoc.swagger-ui.operations-sorter=method

# JWT
app.jwt.secret=your-256-bit-secret-key-for-jwt-signing-replace-in-prod
app.jwt.expiration-ms=86400000

# Rate limiting: 100 req per minute per IP
app.rate-limit.capacity=100
app.rate-limit.refill-tokens=100
app.rate-limit.refill-duration-seconds=60

# Demo credentials
app.demo.username=demo
app.demo.password=demo-password

# Logging
logging.level.com.university=INFO
